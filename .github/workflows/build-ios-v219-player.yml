name: Build iOS v2.19 Satori (Russian dictionary)

# Builds the upstream v0.3.5 release code (base) with the Russian dictionary and our own changes.
# The app version is set in ONE place: APP_VERSION below.

on:
  workflow_dispatch:
    inputs:
      english:
        description: 'Control build: keep the ORIGINAL English dictionary'
        type: boolean
        default: false
      entitlements:
        description: 'Embed the App Group entitlement (settings/statistics sync). Turn off if installing fails.'
        type: boolean
        default: true
      full_entitlements:
        description: 'Embed all 5 App Groups of the profile and a shared keychain group (not only group .1). Turn off if installing fails.'
        type: boolean
        default: true
      dict_release:
        description: 'Language dictionary: release tag with the dictionary files (zip)'
        type: string
        default: dict
      dict_glob:
        description: 'Language dictionary: name of the zip file (pattern, e.g. jp-ru-*.zip)'
        type: string
        default: 'jp-ru-*.zip'
      dict_converter:
        description: 'Language dictionary: converter script from custom-dict/ (zip -> JMdict xml)'
        type: string
        default: kolobok_to_jmdict.py
      display_120hz:
        description: 'Let the display link run above 60 Hz on ProMotion (CADisableMinimumFrameDurationOnPhone). Turn off to compare with 60 Hz.'
        type: boolean
        default: true
      runner:
        description: 'Runner: macos-26; macos-15-intel when GitHub has no Apple Silicon runners free (Xcode 26 is there too)'
        type: choice
        options:
          - macos-26
          - macos-15-intel
          - macos-15
        default: macos-26

env:
  APP_VERSION: "2.19"
  RELEASE_COMMIT: 0f9ea39181d1dc66ce715665f5ef08b494e261a1

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout our files (dictionary converter)
        uses: actions/checkout@v4
        with:
          path: ours

      - name: Checkout upstream release code (base v0.3.5)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          path: src

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install the iOS platform (needed for device builds on Xcode 26)
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS" || true
          # the device SDK is part of Xcode; the download (simulator runtime) may fail on the runner
          xcodebuild -downloadPlatform iOS || echo "::warning::iOS platform download failed, building with the installed SDK"
          xcodebuild -showsdks | grep -i "iOS" || true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
          run_install: false

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Make Node 20 the default node (Xcode scripts use a fixed PATH)
        run: |
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo ln -sf "$(command -v npm)" /usr/local/bin/npm
          sudo ln -sf "$(command -v npx)" /usr/local/bin/npx
          /usr/local/bin/node --version

      - name: Install cargo
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Install pnpm deps
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: Add Anki import libraries (zip, zstd, SQLite)
        run: |
          set -euo pipefail
          # installed outside the pnpm workspace (the workspace packages are not built yet) and copied next to the app code
          mkdir -p /tmp/ankilibs
          cd /tmp/ankilibs
          npm init -y > /dev/null
          npm install fflate fzstd sql.js --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/src/main/node_modules"
          for pkg in fflate fzstd sql.js; do
            rm -rf "$GITHUB_WORKSPACE/src/main/node_modules/$pkg"
            cp -R "/tmp/ankilibs/node_modules/$pkg" "$GITHUB_WORKSPACE/src/main/node_modules/$pkg"
          done
          ls "$GITHUB_WORKSPACE/src/main/node_modules/sql.js/dist" | head -20

      - name: Download Russian dictionary from release "dict"
        if: ${{ !inputs.english }}
        env:
          DICT_RELEASE: ${{ inputs.dict_release }}
        run: |
          mkdir -p ours/custom-dict
          gh release download "$DICT_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --pattern 'jlpt_*.csv' --dir ours/custom-dict --clobber
          ls -la ours/custom-dict

      - name: Download original JMdict files (JMnedict is still needed)
        working-directory: src
        run: pnpm run --dir ./crates/yomikiri-dictionary-generator download

      - name: Replace JMdict with Russian dictionary
        if: ${{ !inputs.english }}
        env:
          DICT_GLOB: ${{ inputs.dict_glob }}
          DICT_CONVERTER: ${{ inputs.dict_converter }}
        run: |
          set -euo pipefail
          ORIG=src/crates/yomikiri-dictionary-generator/jmdict/jmdict_english.xml
          ls -la "$ORIG"
          ZIP=$(ls ours/custom-dict/$DICT_GLOB | head -n1)
          python3 "ours/custom-dict/$DICT_CONVERTER" "$ZIP" /tmp/jmdict_ru.xml --orig "$ORIG"
          mv /tmp/jmdict_ru.xml "$ORIG"
          ls -la "$ORIG"

      - name: Patch Rust (example sentences in dictionary entries)
        run: |
          python3 - <<'PY'
          import pathlib

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          def edit(path, fn):
              p = pathlib.Path("src") / path
              p.write_text(fn(p.read_text(encoding="utf-8")), encoding="utf-8")

          # --- jmdict crate: <example>japanese U+E002 translation</example>
          def types_rs(s):
              return replace_once(s, "    // 'example'\n    // example: Vec<Example>,\n}\n", """    /// 'example' (custom format: japanese, U+E002, translation)
              pub examples: Vec<JMExample>,
          }

          #[derive(Debug, Default, Clone, PartialEq, Eq, Serialize, Deserialize)]
          pub struct JMExample {
              pub japanese: String,
              pub translation: String,
          }
          """, "types.rs example field")
          edit("crates/jmdict/src/jmdict/types.rs", types_rs)

          def parse_rs(s):
              s = replace_once(s, "use super::types::{\n    JMDialect, JMDict, JMEntry, JMKanji, JMKanjiInfo, JMPartOfSpeech, JMReading, JMSense,\n    JMSenseMisc,\n};",
                  "use super::types::{\n    JMDialect, JMDict, JMEntry, JMExample, JMKanji, JMKanjiInfo, JMPartOfSpeech, JMReading,\n    JMSense, JMSenseMisc,\n};", "parse.rs import")
              s = replace_once(s, """                b"example" => {
                              parse_string_in_tag_into(&mut self.reader, &mut self.buf, b"example")?;
                          }""", """                b"example" => {
                              let text =
                                  parse_string_in_tag_into(&mut self.reader, &mut self.buf, b"example")?;
                              if let Some((japanese, translation)) = text.split_once('\\u{e002}') {
                                  sense.examples.push(JMExample {
                                      japanese: japanese.to_string(),
                                      translation: translation.to_string(),
                                  });
                              }
                          }""", "parse.rs example arm")
              return s
          edit("crates/jmdict/src/jmdict/parse.rs", parse_rs)

          # --- yomikiri-dictionary crate: Sense.examples
          def entry_rs(s):
              return replace_once(s, "    pub dialects: Vec<JMDialect>,\n}\n", """    pub dialects: Vec<JMDialect>,
              /// Example sentences (Japanese with marked keyword, translation)
              pub examples: Vec<SenseExample>,
          }

          #[cfg_attr(feature = "wasm", derive(Tsify))]
          #[cfg_attr(feature = "wasm", tsify(into_wasm_abi))]
          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(rename_all = "camelCase")]
          pub struct SenseExample {
              /// The keyword is wrapped in U+E000 ... U+E001
              pub japanese: String,
              pub translation: String,
          }
          """, "entry.rs Sense")
          edit("crates/yomikiri-dictionary/src/entry.rs", entry_rs)

          def jmdict_rs(s):
              s = replace_once(s, "    GroupedSense, Kanji, PartOfSpeech, Rarity, Reading, Sense, WordEntry, WordEntryInner,\n};",
                  "    GroupedSense, Kanji, PartOfSpeech, Rarity, Reading, Sense, SenseExample, WordEntry,\n    WordEntryInner,\n};", "jmdict.rs import")
              return replace_once(s, "            meanings: jm_sense\n", """            examples: jm_sense
                          .examples
                          .into_iter()
                          .map(|e| SenseExample {
                              japanese: e.japanese,
                              translation: e.translation,
                          })
                          .collect(),
                      meanings: jm_sense
          """, "jmdict.rs From")
          edit("crates/yomikiri-dictionary/src/jmdict.rs", jmdict_rs)

          edit("crates/yomikiri-dictionary/src/jmnedict.rs", lambda s: replace_once(s,
              "                    dialects: vec![],\n                })",
              "                    dialects: vec![],\n                    examples: vec![],\n                })", "jmnedict.rs"))
          edit("crates/yomikiri-dictionary/src/lib.rs", lambda s: replace_once(s,
              "pub use entry::{Kanji, PartOfSpeech, Reading, Sense, WordEntry};",
              "pub use entry::{Kanji, PartOfSpeech, Reading, Sense, SenseExample, WordEntry};", "lib.rs"))
          PY

      - name: Add example sentences to the Russian dictionary (XML)
        if: ${{ !inputs.english }}
        env:
          DICT_GLOB: ${{ inputs.dict_glob }}
        run: |
          set -euo pipefail
          ORIG=src/crates/yomikiri-dictionary-generator/jmdict/jmdict_english.xml
          ZIP=$(ls ours/custom-dict/$DICT_GLOB | head -n1)
          cat > /tmp/add_examples.py <<'PY'
          import glob, json, sys, zipfile, re, unicodedata

          KS, KE, SEP = "\ue000", "\ue001", "\ue002"

          def flat(node, mark=False):
              """Plain text of structured content; skips <rt>; marks example-keyword."""
              if node is None:
                  return ""
              if isinstance(node, str):
                  return node
              if isinstance(node, list):
                  return "".join(flat(n, mark) for n in node)
              if isinstance(node, dict):
                  tag = node.get("tag")
                  if tag == "rt" or tag == "rp":
                      return ""
                  inner = flat(node.get("content"), mark)
                  data = node.get("data") or {}
                  if mark and data.get("content") == "example-keyword" and inner:
                      return KS + inner + KE
                  return inner
              return ""

          def walk(node, fn):
              if isinstance(node, list):
                  for n in node:
                      walk(n, fn)
              elif isinstance(node, dict):
                  fn(node)
                  walk(node.get("content"), fn)

          def find(node, name, out):
              def f(n):
                  d = n.get("data")
                  if d and d.get("content") == name:
                      out.append(n)
              walk(node, f)
              return out

          def norm(s):
              return re.sub(r"\s+", " ", unicodedata.normalize("NFKC", s)).strip()

          def extract(zip_path):
              """-> {seq: [variant, ...]}, variant = [ {"glosses": [..], "examples": [(ja_marked, ru)]}, ... ] (all senses of one Yomitan entry)"""
              result = {}
              with zipfile.ZipFile(zip_path) as z:
                  names = sorted(n for n in z.namelist() if re.match(r"term_bank_\d+\.json$", n.split("/")[-1]))
                  for name in names:
                      for e in json.loads(z.read(name)):
                          seq = e[6]
                          variant = []
                          for g in e[5]:
                              if not isinstance(g, dict) or g.get("type") != "structured-content":
                                  continue
                              for sense in find(g["content"], "sense", []):
                                  glosses = []
                                  for gl in find(sense, "glossary", []):
                                      c = gl.get("content")
                                      for li in (c if isinstance(c, list) else [c]):
                                          t = norm(flat(li))
                                          if t:
                                              glosses.append(t)
                                  exs = []
                                  for ex in find(sense, "example-sentence", []):
                                      a = find(ex, "example-sentence-a", [])
                                      b = find(ex, "example-sentence-b", [])
                                      if a and b:
                                          ja = flat(a[0], True).strip()
                                          ru = re.sub(r"\s*\[\d+\]\s*$", "", norm(flat(b[0])))
                                          if ja and ru and (ja, ru) not in exs:
                                              exs.append((ja, ru))
                                  variant.append({"glosses": glosses, "examples": exs})
                          if any(s["examples"] for s in variant):
                              lst = result.setdefault(seq, [])
                              if variant not in lst:
                                  lst.append(variant)
              return result


          import html, re, sys, unicodedata

          MAX_PER_SENSE = 2
          ENTRY_RE = re.compile(r"<entry>.*?</entry>", re.S)
          SEQ_RE = re.compile(r"<ent_seq>\s*(\d+)\s*</ent_seq>")
          SENSE_RE = re.compile(r"<sense>.*?</sense>", re.S)
          GLOSS_RE = re.compile(r"<gloss[^>]*>(.*?)</gloss>", re.S)

          def tokens(glosses):
              return set(re.findall(r"\w+", " ".join(glosses).lower()))

          def clean(t):
              return t.replace("&", "\uff06").replace("<", "\u2039").replace(">", "\u203a")

          def inject(xml_in, xml_out, zip_path):
              data = extract(zip_path)
              st = dict(entries=0, senses=0, matched_index=0, matched_gloss=0, examples=0)
              with open(xml_in, encoding="utf-8") as f:
                  text = f.read()

              def fix_entry(m):
                  block = m.group(0)
                  sm = SEQ_RE.search(block)
                  if not sm:
                      return block
                  variants = data.get(int(sm.group(1)))
                  if not variants:
                      return block
                  senses = SENSE_RE.findall(block)
                  if not senses:
                      return block
                  xml_g = [[norm(html.unescape(g)) for g in GLOSS_RE.findall(s)] for s in senses]
                  chosen = [None] * len(senses)
                  # 1) variant with the same number of senses, best gloss overlap, matched by index
                  same = [v for v in variants if len(v) == len(senses)]
                  if same:
                      def score(v):
                          total = 0.0
                          for xg, ys in zip(xml_g, v):
                              a, b = tokens(xg), tokens(ys["glosses"])
                              if a and b:
                                  total += len(a & b) / len(a | b)
                          return total
                      best = max(same, key=score)
                      chosen = [ys["examples"] for ys in best]
                      st["matched_index"] += len(senses)
                  else:
                      # 2) per sense: identical gloss list in some variant
                      for i, xg in enumerate(xml_g):
                          for v in variants:
                              for ys in v:
                                  if ys["glosses"] == xg and ys["examples"]:
                                      chosen[i] = ys["examples"]
                                      break
                              if chosen[i]:
                                  break
                          if chosen[i]:
                              st["matched_gloss"] += 1
                  st["entries"] += 1
                  st["senses"] += len(senses)
                  out, pos, idx = [], 0, 0
                  for sm2 in SENSE_RE.finditer(block):
                      s = sm2.group(0)
                      exs = chosen[idx] or []
                      idx += 1
                      if exs:
                          add = "".join(
                              "<example>%s%s%s</example>" % (clean(ja), SEP, clean(ru))
                              for ja, ru in exs[:MAX_PER_SENSE]
                          )
                          st["examples"] += min(len(exs), MAX_PER_SENSE)
                          s = s[: -len("</sense>")] + add + "</sense>"
                      out.append(block[pos : sm2.start()])
                      out.append(s)
                      pos = sm2.end()
                  out.append(block[pos:])
                  return "".join(out)

              text = ENTRY_RE.sub(fix_entry, text)
              with open(xml_out, "w", encoding="utf-8") as f:
                  f.write(text)
              print("examples injected:", st)
              if st["examples"] == 0:
                  raise SystemExit("ERROR: no examples were matched to dictionary entries")


          if __name__ == "__main__":
              inject(sys.argv[1], sys.argv[2], sys.argv[3])
          PY
          python3 /tmp/add_examples.py "$ORIG" /tmp/jmdict_ru_examples.xml "$ZIP"
          mv /tmp/jmdict_ru_examples.xml "$ORIG"
          ls -la "$ORIG"

      - name: Generate yomikiri dictionary
        working-directory: src
        run: pnpm run --dir ./crates/yomikiri-dictionary-generator generate

      - name: Patch Svelte (example sentences in the word card)
        run: |
          python3 - <<'PY'
          import pathlib

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          p = pathlib.Path("src/main/src/components/dictionary/GroupedSenseView.svelte")
          s = p.read_text(encoding="utf-8")

          s = replace_once(s, '  $: posText = group.pos.join(", ");\n', '''  $: posText = group.pos.join(", ");

            /** Splits an example sentence into plain parts and the keyword (U+E000 ... U+E001). */
            function exampleParts(text: string): { text: string; key: boolean }[] {
              const parts: { text: string; key: boolean }[] = [];
              const re = /\\ue000(.*?)\\ue001/g;
              let last = 0;
              let m: RegExpExecArray | null;
              while ((m = re.exec(text)) !== null) {
                if (m.index > last) parts.push({ text: text.slice(last, m.index), key: false });
                parts.push({ text: m[1], key: true });
                last = m.index + m[0].length;
              }
              if (last < text.length) parts.push({ text: text.slice(last), key: false });
              return parts;
            }
          ''', "svelte script")

          s = replace_once(s, '''          >{/if}
                </div>
              {/each}''', '''          >{/if}
                  {#if sense.examples && sense.examples.length > 0}
                    <div class="examples">
                      {#each sense.examples as example}
                        <div class="example">
                          <div class="example-ja">
                            {#each exampleParts(example.japanese) as part}{#if part.key}<b>{part.text}</b>{:else}{part.text}{/if}{/each}
                          </div>
                          <div class="example-tr">{example.translation}</div>
                        </div>
                      {/each}
                    </div>
                  {/if}
                </div>
              {/each}''', "svelte template")

          s = replace_once(s, "</style>", '''
            .examples {
              margin: 0.2rem 0 0.4rem 1.1rem;
              padding-left: 0.6rem;
              border-left: 2px solid var(--text-faint);
            }

            .example {
              margin-bottom: 0.25rem;
            }

            .example-ja {
              font-size: 0.9rem;
              line-height: 1.35;
              color: var(--text-light);
            }

            .example-ja b {
              font-weight: 600;
              color: var(--text);
            }

            .example-tr {
              font-size: 0.8rem;
              line-height: 1.3;
              color: var(--text-faint);
            }
          </style>''', "svelte style")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Patch Swift (App Group sync, statistics tab, share sheet)
        run: |
          python3 "$GITHUB_WORKSPACE/ours/ci/patches/patch_swift_app_group_stats_share.py"

      - name: Patch TypeScript (add "audio" field type)
        run: |
          python3 - <<'PY'
          import pathlib

          d = pathlib.Path("src/main/src/lib/anki")

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          # template.ts: new field type "audio"
          p = d / "template.ts"
          s = p.read_text()
          s = replace_once(s, '  link: FieldBase<"link">;\n}', '  link: FieldBase<"link">;\n  audio: FieldBase<"audio">;\n}', "types")
          s = replace_once(s, '  "url",\n  "link",\n];', '  "url",\n  "link",\n  "audio",\n];', "type list")
          s = replace_once(s, '  link: "link",\n};', '  link: "link",\n  audio: "audio",\n};', "labels")
          s = replace_once(s, '    content === "link"\n  ) {', '    content === "link" ||\n    content === "audio"\n  ) {', "new field")
          p.write_text(s)

          # ankiBuilder.ts: builder for "audio"
          p = d / "ankiBuilder.ts"
          s = p.read_text()
          s += """
          /**
           * Audio from JapanesePod101.
           *
           * AnkiMobile downloads a field's content by itself if the whole field is a link
           * to an audio file, and replaces it with a [sound:...] tag.
           * The link must end with a known file extension, so a fake argument is appended.
           */
          const JPOD101_URL = "https://assets.languagepod101.com/dictionary/japanese/audiomp3.php";
          /** Size of the 'audio not available' clip that JapanesePod101 returns. */
          const JPOD101_PLACEHOLDER_SIZE = 52288;

          async function findJpod101Audio(word: string, reading: string): Promise<string> {
            const query = `?kanji=${encodeURIComponent(word)}&kana=${encodeURIComponent(reading)}`;
            try {
              const resp = await fetch(JPOD101_URL + query);
              if (!resp.ok) return "";
              const buf = await resp.arrayBuffer();
              if (buf.byteLength === JPOD101_PLACEHOLDER_SIZE || buf.byteLength < 2000) {
                return "";
              }
            } catch (err) {
              // Could not verify (network or cross-origin restrictions).
              // Still give the link to AnkiMobile.
              console.warn("Could not check JapanesePod101 audio:", err);
            }
            return JPOD101_URL + query + "&fakePath=audio.mp3";
          }

          addBuilder("audio", (_opts, data) => {
            const token = data.tokenized.tokens[data.tokenized.tokenIdx];
            const word = token.base;
            const reading = getReadingForForm(data.entry, word, false).reading || word;
            return Utils.PromiseWithProgress.fromPromise(
              findJpod101Audio(word, reading),
              "Finding audio...",
            );
          });
          """
          p.write_text(s)
          # config.ts: bake the Anki template into the defaults.
          # Sideloaded builds have no shared storage, so the extension cannot see
          # settings saved in the app. Stored settings still override these defaults.
          import json
          DEFAULT_TEMPLATE = {
              "deck": "mining",
              "notetype": "kaishi mining",
              "tags": "yomikiri-ru",
              "fields": [
                  {"name": "Word", "content": "word", "form": "as-is", "style": "basic"},
                  {"name": "Reading", "content": ""},
                  {"name": "Meaning", "content": "meaning", "full_format": "numbered", "full_pos": False, "full_max_item": 0, "single_pos": False, "single_max_item": 0},
                  {"name": "Sentence", "content": "sentence", "style": "basic", "word": "none"},
                  {"name": "SentenceMeaning", "content": "translated-sentence"},
                  {"name": "Audio", "content": "audio"},
                  {"name": "SectenceAudio", "content": ""},
                  {"name": "Image", "content": ""},
                  {"name": "Furigana", "content": "word", "form": "main-dict-form", "style": "furigana-anki"},
              ],
          }
          override = pathlib.Path("ours/custom-dict/anki_template.json")
          template = json.loads(override.read_text()) if override.exists() else DEFAULT_TEMPLATE
          p = pathlib.Path("src/main/src/lib/config.ts")
          s = p.read_text()
          old = '  "anki.anki_template": null,\n  "anki.enabled": false,'
          assert s.count(old) == 1, "default anki options not found in config.ts"
          tpl_ts = json.dumps(template, indent=2, ensure_ascii=False).replace("\n", "\n  ")
          s = s.replace(old, '  "anki.anki_template": ' + tpl_ts + ',\n  "anki.enabled": true,')
          s = replace_once(s, '  "general.font_size": 14,', '  "general.font_size": 11,', "default font size")
          p.write_text(s)

          # translate.ts: translate sentences into Russian instead of English
          p = pathlib.Path("src/main/src/platform/common/translate.ts")
          s = p.read_text()
