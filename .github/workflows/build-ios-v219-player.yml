                          }
                      }
                  }
          ''', "after restore")

          s = replace_once(s, '''    static func autoSelectJapanese(coordinator: KSVideoPlayer.Coordinator, pickSubtitle: Bool,''',
          '''    /// The last subtitle choice of any video: a language (nil = subtitles off). Repeated a few times,
              /// because the player selects its own default track right after the start.
              @MainActor
              static func restoreLastChoice(coordinator: KSVideoPlayer.Coordinator, lang: String?, key: String,
                                            excluded: Set<Int>) async -> Bool {
                  for _ in 0..<60 {
                      if !coordinator.subtitleModel.subtitleInfos.isEmpty { break }
                      try? await Task.sleep(nanoseconds: 250_000_000)
                  }
                  var pick: FFmpegAssetTrack?
