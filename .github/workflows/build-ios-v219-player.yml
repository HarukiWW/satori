          s = replace_once(s, '''                    showLookup = false
                              coordinator.playerLayer?.play()
                          }
          ''', '''                    showLookup = false
                              coordinator.playerLayer?.play()
                              if delay == 0.4 { restartOutput() }
                          }
          ''', "restart after anki return")

          # unused value
          s = replace_once(s, '''        guard resumeHandled, let layer = coordinator.playerLayer, layer.player.isPlaying else { return }
                  let time = layer.player.currentPlaybackTime
          ''', '''        guard resumeHandled, coordinator.playerLayer?.player.isPlaying == true else { return }
          ''', "unused time")

          p.write_text(s, encoding="utf-8")
          print("v129 fixes applied")
          PY

      - name: Optimizations - shared formatters
        run: |
          python3 - <<'PY'
          import pathlib

          # ---------- statistics: one NumberFormatter instead of one per row ----------
          hv = pathlib.Path("src/safari/iOS (App)/HelpView.swift")
          t = hv.read_text(encoding="utf-8")
          old_num = '''private func statNumber(_ n: Int) -> String {
              let formatter = NumberFormatter()
              formatter.numberStyle = .decimal
              formatter.locale = Locale(identifier: "ru_RU")
              return formatter.string(from: NSNumber(value: n)) ?? String(n)
          }'''
          if old_num in t:
              t = t.replace(old_num, '''private let statNumberFormatter: NumberFormatter = {
              let formatter = NumberFormatter()
              formatter.numberStyle = .decimal
              formatter.locale = Locale(identifier: "ru_RU")
              return formatter
          }()

          private func statNumber(_ n: Int) -> String {
              return statNumberFormatter.string(from: NSNumber(value: n)) ?? String(n)
          }''')
              hv.write_text(t, encoding="utf-8")
              print("statistics: number formatter is shared")
          else:
              print("statistics: pattern not in this build, skipped")

          # ---------- extension journal: one ISO formatter instead of one per request ----------
          ut = pathlib.Path("src/safari/YomikiriTokenizer/YomikiriTokenizer/Utils.swift")
          u = ut.read_text(encoding="utf-8")
          old_stamp = "    let stamp = ISO8601DateFormatter().string(from: Date())\n"
          if old_stamp in u:
              u = u.replace(old_stamp, "    let stamp = extLogStamp.string(from: Date())\n")
              u = u.replace("/// Short request log shared by the app and the Safari extension",
                            "private let extLogStamp = ISO8601DateFormatter()\n\n/// Short request log shared by the app and the Safari extension", 1)
              ut.write_text(u, encoding="utf-8")
              print("journal: timestamp formatter is shared")
          else:
              print("journal: not in this build, skipped")
          PY

      - name: Highlight descriptions - shorter
        run: |
          python3 - <<'PY'
          import pathlib, re

          # Shorter descriptions of the highlight settings (the text is only replaced where it is found)
          p = pathlib.Path("src/main/src/components/options/groups/GroupHighlight.svelte")
          if not p.exists():
              print("highlight descriptions: file not in this build, skipped")
          else:
              t = p.read_text(encoding="utf-8")
              replacements = [
                  (r'(<OptionToggle bind:value=\{\$enabledConfig\} title="Подсвечивать слова">\n    )([\s\S]*?)(\n  </OptionToggle>)',
                   'Выделяет слова, которых ещё нет в Anki. После изменения обновите страницу.'),
                  (r'(<OptionToggle bind:value=\{\$freqConfig\} title="Подсвечивать по частотности">\n    )([\s\S]*?)(\n  </OptionToggle>)',
                   'Выделяет слова по частотности: 1 — самое частое слово, чем больше число, тем реже слово.'),
                  (r'(<OptionNumber bind:value=\{\$minConfig\} title="От места"[^>]*>\n    )([\s\S]*?)(\n  </OptionNumber>)',
                   'Слова чаще этого места не выделяются: их вы, скорее всего, знаете.'),
                  (r'(<OptionNumber bind:value=\{\$maxConfig\} title="До места"[^>]*>\n    )([\s\S]*?)(\n  </OptionNumber>)',
                   'Слова реже этого места не выделяются.'),
                  (r'(<div class="note">\n    )(Отметьте уровни[\s\S]*?)(\n  </div>)',
                   'Уровни JLPT, которые нужно выделять. Цвет уровня важнее цвета частотности. Списки составило сообщество.'),
              ]
              done = 0
              for pattern, new in replacements:
                  t, n = re.subn(pattern, lambda m, new=new: m.group(1) + new + m.group(3), t, count=1)
                  done += n
              p.write_text(t, encoding="utf-8")
              print(f"highlight descriptions: {done} of {len(replacements)} replaced")
          PY

