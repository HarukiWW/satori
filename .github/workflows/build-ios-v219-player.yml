          ''', '''        UserDefaults.standard.set(track.subtitleID, forKey: subChoiceKey)
                  UserDefaults.standard.set("embedded", forKey: "subchoice.last.kind")
                  UserDefaults.standard.set(track.languageCode ?? "", forKey: "subchoice.last.lang")
          ''', "chooseEmbedded")
          s = replace_once(s, '''        UserDefaults.standard.set("file:" + file.lastPathComponent, forKey: subChoiceKey)
          ''', '''        UserDefaults.standard.set("file:" + file.lastPathComponent, forKey: subChoiceKey)
                  UserDefaults.standard.set("external", forKey: "subchoice.last.kind")
                  let videoBase = url.deletingPathExtension().lastPathComponent
                  if file.lastPathComponent.hasPrefix(videoBase) {
                      UserDefaults.standard.set(String(file.lastPathComponent.dropFirst(videoBase.count)), forKey: "subchoice.last.suffix")
                  }
          ''', "chooseExternal")

          # 2. loadSubtitles: external choice must survive the player's own default track; last choice for new videos
          s = replace_once(s, '''        subDelay = UserDefaults.standard.double(forKey: delayKey)
          ''', '''        subDelay = UserDefaults.standard.double(forKey: delayKey)
                  syncMessage = HighlightData.diagnostic()
          ''', "diagnostic")

          s = replace_once(s, '''        var restoredFile = false
                  if let savedChoice, savedChoice.hasPrefix("file:") {
                      let file = folder.appendingPathComponent(String(savedChoice.dropFirst(5)))
                      if FileManager.default.fileExists(atPath: file.path) {
                          chooseExternal(file)
