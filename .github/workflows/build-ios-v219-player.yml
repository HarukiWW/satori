      - name: Patch Anki import (colpkg/apkg collections, known words)
        run: |
          python3 - <<'PY'
          import pathlib

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          LIB = r'''import { unzipSync } from "fflate";
          import { decompress } from "fzstd";
          import { Platform } from "@platform";
          // @ts-ignore pure JavaScript build, no wasm file to copy; static import because the iife bundle has no dynamic imports
          import initSqlJs from "sql.js/dist/sql-asm.js";

          const TAGS = /<[^>]*>/g;
          const BRACKETS = /\[[^\]]*\]/g;
          const SPACES = /\s+/g;

          /** The same word rule as for mined notes: Furigana, then Word, then the first field. */
          function wordFromFields(names: string[], values: string[]): string {
            let i = names.indexOf("Furigana");
            if (i < 0) i = names.indexOf("Word");
            if (i < 0) i = 0;
            return (values[i] ?? "").replace(TAGS, "").replace(BRACKETS, "").replace(SPACES, "");
          }

          function collectionBytes(data: Uint8Array): Uint8Array {
            const files = unzipSync(data);
            if (files["collection.anki21b"]) return decompress(files["collection.anki21b"]);
            if (files["collection.anki2"]) return files["collection.anki2"];
            throw new Error("в архиве нет базы коллекции");
          }

          function fieldNames(db: any): Record<string, string[]> {
            const out: Record<string, string[]> = {};
            try {
              const rows = db.exec("select ntid, ord, name from fields order by ntid, ord");
              for (const row of rows[0] ? rows[0].values : []) {
                const key = String(row[0]);
                if (!out[key]) out[key] = [];
                out[key].push(String(row[2]));
              }
              if (Object.keys(out).length > 0) return out;
            } catch (e) {
              // older collections keep the note types in col.models
            }
            const models = JSON.parse(db.exec("select models from col")[0].values[0][0]);
            for (const key of Object.keys(models)) {
              out[key] = models[key].flds.map((f: any) => String(f.name));
            }
            return out;
          }

          /** Words of all notes of an Anki collection package (.colpkg or .apkg). */
          export async function readAnkiWords(buf: ArrayBuffer): Promise<string[]> {
            const bytes = collectionBytes(new Uint8Array(buf));
            // @ts-ignore pure JavaScript build, no wasm file to copy
            const SQL = await initSqlJs();
            const db = new SQL.Database(bytes);
            try {
              const names = fieldNames(db);
              const words = new Set<string>();
              const rows = db.exec("select mid, flds from notes");
              for (const row of rows[0] ? rows[0].values : []) {
                const values = String(row[1]).split("\x1f");
                const word = wordFromFields(names[String(row[0])] ?? [], values);
                if (word) words.add(word);
              }
              return Array.from(words);
            } finally {
              db.close();
            }
          }

          /** Adds the words to the known list (they are not highlighted). Returns how many were new. */
          export async function importKnownWords(words: string[]): Promise<number> {
            const raw = (await Platform.messageWebview("loadStats", null)) as any;
            const data: any = raw && raw.days !== undefined ? raw : { days: {} };
            const set = new Set<string>(Array.isArray(data.known) ? data.known : []);
            let added = 0;
            for (const w of words) {
              if (!set.has(w)) {
                set.add(w);
                added++;
              }
            }
            data.known = Array.from(set);
            await Platform.messageWebview("saveStats", data);
            return added;
          }
          '''

          SVELTE = r'''<script lang="ts">
            import { readAnkiWords, importKnownWords } from "lib/ankiImport";

            let status = "";
            let busy = false;

            async function onFile(e: Event) {
              const input = e.target as HTMLInputElement;
              const file = input.files ? input.files[0] : undefined;
              input.value = "";
              if (!file) return;
              busy = true;
              status = "Чтение колоды...";
              try {
                const words = await readAnkiWords(await file.arrayBuffer());
                const added = await importKnownWords(words);
                status = `Слов в колоде: ${words.length}, добавлено новых: ${added}. Они больше не подсвечиваются.`;
              } catch (err) {
                status = "Не удалось прочитать колоду: " + (err instanceof Error ? err.message : String(err));
              } finally {
                busy = false;
              }
            }
          </script>

          <div class="import">
            <div class="title">Импорт колоды Anki</div>
            <label class="pick">
              <input type="file" on:change={onFile} disabled={busy} />
              Выбрать файл .colpkg или .apkg
            </label>
            {#if status}<div class="status">{status}</div>{/if}
          </div>

          <style>
            .import {
              margin: 12px 16px;
              font-size: 0.95rem;
            }
            .title {
              font-weight: 600;
              margin-bottom: 6px;
            }
            .status {
              margin-top: 6px;
              font-size: 0.85rem;
              color: var(--text-faint);
            }
          </style>
          '''

          base = pathlib.Path("src")
          (base / "main/src/lib/ankiImport.ts").write_text(LIB, encoding="utf-8")
          (base / "main/src/components/options/groups/GroupAnkiImport.svelte").write_text(SVELTE, encoding="utf-8")

          p = base / "main/src/components/options/MainColumn.svelte"
          s = p.read_text(encoding="utf-8")
          s = replace_once(s, 'import GroupAnki from "./groups/GroupAnki.svelte";\n',
              'import GroupAnki from "./groups/GroupAnki.svelte";\n  import GroupAnkiImport from "./groups/GroupAnkiImport.svelte";\n', "import")
          s = replace_once(s, "  <GroupAnki />\n", "  <GroupAnki />\n  {#if Platform.IS_IOSAPP}\n    <GroupAnkiImport />\n  {/if}\n", "mount")
          p.write_text(s, encoding="utf-8")

          p = base / "main/src/lib/statsLite.ts"
          s = p.read_text(encoding="utf-8")
          s = replace_once(s, "export interface LiteStats {\n", "export interface LiteStats {\n  known?: string[];\n", "LiteStats")
          s = replace_once(s, "const mined = Array.from(set);", "(data.known ?? []).forEach((w) => set.add(w));\n  const mined = Array.from(set);", "findMinedLite")
          p.write_text(s, encoding="utf-8")

          p = base / "safari/iOS (App)/HelpView.swift"
          s = p.read_text(encoding="utf-8")
          s = replace_once(s, "return words", 'for w in (root["known"] as? [String]) ?? [] { words.insert(w) }\n        return words', "minedWords")
          p.write_text(s, encoding="utf-8")

          p = base / "main/esbuild.config.ts"
          s = p.read_text(encoding="utf-8")
          s = replace_once(s, '    format: "iife",\n', '    format: "iife",\n    external: ["fs", "path", "crypto", "node:*"],\n', "esbuild external")
          p.write_text(s, encoding="utf-8")
          PY

