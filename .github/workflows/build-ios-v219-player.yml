                      }
                  }
                  // a video without its own choice: the last choice of any video (same kind of file, language, or none)
                  let lastKind = UserDefaults.standard.string(forKey: "subchoice.last.kind")
                  if savedChoice == nil, lastKind == "external",
                     let suffix = UserDefaults.standard.string(forKey: "subchoice.last.suffix"),
                     let file = externalURLs.first(where: { $0.lastPathComponent == base + suffix }) {
                      chooseExternal(file)
                      restoredFile = true
                      restoredURL = file
                  }
                  let useLast = savedChoice == nil && !restoredFile && (lastKind == "embedded" || lastKind == "none")
          ''', "restore block")

          s = replace_once(s, '''pickSubtitle: !hasExternal && !restoredFile && embeddedChoice == nil,''',
                           '''pickSubtitle: !hasExternal && !restoredFile && embeddedChoice == nil && !useLast,''', "pickSubtitle")

          s = replace_once(s, '''        if !restoredFile, let embeddedChoice {
                      await NativeVideoEngine.restoreSavedSubtitle(coordinator: coordinator, saved: embeddedChoice,
                                                                   key: subChoiceKey)
                  }
          ''', '''        if !restoredFile, let embeddedChoice {
                      await NativeVideoEngine.restoreSavedSubtitle(coordinator: coordinator, saved: embeddedChoice,
                                                                   key: subChoiceKey)
                  }
                  if useLast {
                      let lang: String? = lastKind == "none" ? nil : (UserDefaults.standard.string(forKey: "subchoice.last.lang") ?? "")
                      if lastKind == "none" {
                          usingExternal = false
                          activeExternal = nil
                      }
                      let applied = await NativeVideoEngine.restoreLastChoice(coordinator: coordinator, lang: lang,
                                                                              key: subChoiceKey, excluded: skipped)
                      if !applied, !hasExternal {
                          await NativeVideoEngine.autoSelectJapanese(coordinator: coordinator, pickSubtitle: true, excluded: skipped)
                      }
                  }
                  if restoredFile, let restored = restoredURL {
                      // KSPlayer picks its own subtitle track a little after the start and would replace the file:
                      // keep the chosen file unless the user picks something else
                      for _ in 0..<8 {
