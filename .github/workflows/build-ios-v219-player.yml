      - name: Pre-generate files that Xcode expects to already exist
        working-directory: src
        run: |
          pnpm generate:release
          pnpm build:ios

      - name: Make the "Set Build Version" script safe
        working-directory: src
        run: |
          # The original script fails the whole build when CFBundleVersion already exists
          # (or git/Info.plist are not ready). The final version is written again when packaging the .ipa.
          cat > safari/scripts/set_build_version.sh <<'SH'
          #!/bin/bash
          bundleVersion=$(git log -1 --date=format:"%Y%m%d%H%M%S" --format="%ad" 2>/dev/null || true)
          if [ -z "$bundleVersion" ]; then
            bundleVersion=$(date +%Y%m%d%H%M%S)
          fi
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "$plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $bundleVersion" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $bundleVersion" "$plist" 2>/dev/null \
              || true
          fi
          exit 0
          SH
          chmod +x safari/scripts/set_build_version.sh
          cat safari/scripts/set_build_version.sh

      - name: Build iOS app (unsigned)
        working-directory: src
        run: |
          set -euo pipefail
          PROJ=safari/Yomikiri.xcodeproj
          xcodebuild -list -project "$PROJ"
          SCHEME=$(xcodebuild -list -json -project "$PROJ" | python3 -c "
          import json, sys
          s = json.load(sys.stdin)['project']['schemes']
          bad = ('extension', 'tokenizer', 'test')
          good = [x for x in s if 'yomikiri' in x.lower() and not any(b in x.lower() for b in bad)]
          print((good or s)[0])
          ")
          echo "Scheme: $SCHEME"
          SPM_DIR="$PWD/spm"
          # resolve packages into a known folder, then patch KSPlayer before compiling
          xcodebuild -resolvePackageDependencies -project "$PROJ" -scheme "$SCHEME" -clonedSourcePackagesDirPath "$SPM_DIR"
          # SwiftPM checkouts are read-only: make the KSPlayer checkout writable before patching it
          chmod -R u+w spm/checkouts/KSPlayer
          python3 "$GITHUB_WORKSPACE/ours/ci/patches/ksplayer_build_patches.py"
          # Anime4K Restore CNN S (MIT, (c) bloc97): converted to Metal for the line restoration filter
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/Anime4K_Restore_CNN_S.glsl" "https://raw.githubusercontent.com/bloc97/Anime4K/master/glsl/Restore/Anime4K_Restore_CNN_S.glsl" || echo "Anime4K shader not downloaded: line restoration will be unavailable"
          python3 "$GITHUB_WORKSPACE/ours/ci/patches/v145-ksplayer.py" "$RUNNER_TEMP/Anime4K_Restore_CNN_S.glsl"
          # heavier kinds (v2.11, converted and compiled by v212-anime4k.py since 2.12): Anime4K Restore CNN M and L
          for kind in M L; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/Anime4K_Restore_CNN_$kind.glsl" "https://raw.githubusercontent.com/bloc97/Anime4K/master/glsl/Restore/Anime4K_Restore_CNN_$kind.glsl" || echo "Anime4K $kind not downloaded"
          done
          python3 "$GITHUB_WORKSPACE/ours/ci/patches/v212-anime4k.py" "$RUNNER_TEMP/Anime4K_Restore_CNN_M.glsl" "$RUNNER_TEMP/Anime4K_Restore_CNN_L.glsl"
          python3 "$GITHUB_WORKSPACE/ours/ci/patches/v213-anime4k.py"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$SPM_DIR" -disableAutomaticPackageResolution \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=${{ env.APP_VERSION }} CURRENT_PROJECT_VERSION=${{ env.APP_VERSION }} \
            build 2>&1 | tee xcodebuild.log
      - name: Show build errors
        if: always()
        working-directory: src
        run: |
          [ -f xcodebuild.log ] || exit 0
          echo "=== lines with errors ==="
          grep -n -B3 -A6 "error:\|fatal:\|Entry Already\|Error Reading\|Command PhaseScriptExecution failed" xcodebuild.log | head -250 || true
          # the compiler errors also as annotations: they can be read without signing in to GitHub
          grep -E "(error|fatal error): " xcodebuild.log | sed -E 's#^.*/src/##' | sort -u | head -40 | while IFS= read -r line; do
            line=${line//%/%25}
            echo "::error title=xcodebuild::${line}"
          done || true

      - name: Package .ipa
        working-directory: src
        env:
          GROUP_PREFIX: group.e9b3f7cfcd7710ea
          BUNDLE_ID: app.uva7695.libra5806
          TEAM_ID: L3R6H56C8T
          EMBED_ENTITLEMENTS: ${{ inputs.entitlements }}
          FULL_ENTITLEMENTS: ${{ inputs.full_entitlements }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' | head -n1)
          echo "App: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          APPDIR="ipa/Payload/$(basename "$APP")"
          HL_OUT="$APPDIR/res/hl" python3 - <<'HL'
          import base64, json, os, pathlib, re

          # runs when the .ipa is packed (Xcode rebuilds and cleans the web output itself): frequency and JLPT tables
          # are written as binary files into the built app (res/hl), read by the app for the subtitle highlight
          hl = pathlib.Path(os.environ.get("HL_OUT", "main/build/iosapp/res/hl"))
          hl.mkdir(parents=True, exist_ok=True)
          jl = pathlib.Path("main/src/extension/background/jlptData.ts")
          if jl.exists():
              m = re.search(r'export const JLPT_DATA = "([^"]*)"', jl.read_text(encoding="utf-8"))
              if m and m.group(1):
                  (hl / "jlpt.bin").write_bytes(base64.b64decode(m.group(1)))
                  print("jlpt table written")
          fr = pathlib.Path("main/src/extension/background/frequencyData.ts")
          if fr.exists():
              text = fr.read_text(encoding="utf-8")
              dicts = json.loads(text[text.index("=") + 1:].strip().rstrip(";"))
              index = []
              for d in dicts:
                  name = "freq_" + re.sub(r"[^A-Za-z0-9_-]", "_", d["id"])
                  (hl / (name + ".bin")).write_bytes(base64.b64decode(d["data"]))
                  index.append({"id": d["id"], "name": d["name"], "file": name + ".bin"})
              (hl / "index.json").write_text(json.dumps(index, ensure_ascii=False), encoding="utf-8")
              print("frequency tables written:", len(index))
          HL
          # the grammar decks (v2.00), read by the app from res/grammar
          mkdir -p "$APPDIR/res/grammar"
          cp "$GITHUB_WORKSPACE"/ours/ci/assets/grammar/n*.json "$APPDIR/res/grammar/"
          # the sentences read in advance (v2.15, ci/assets/grammar/voice.py)
          mkdir -p "$APPDIR/res/grammar/audio"
          cp "$GITHUB_WORKSPACE"/ours/ci/assets/grammar/audio/*.mp3 "$APPDIR/res/grammar/audio/"
          echo "grammar audio: $(ls "$APPDIR/res/grammar/audio" | wc -l) files"
          # the third-party licences for «О приложении» (v2.09)
          LICENSES=$(find extra/generate-license -name THIRD_PARTY.txt 2>/dev/null | head -n1 || true)
          if [ -n "$LICENSES" ]; then
            cp "$LICENSES" "$APPDIR/res/THIRD_PARTY.txt"
            ls -la "$APPDIR/res/THIRD_PARTY.txt"
          else
            echo "no THIRD_PARTY.txt: «О приложении» goes without the licences"
          fi
          PLIST="$APPDIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Satori" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Satori" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Satori" "$PLIST" || true
          # app version in the app, the extensions and the frameworks
          for P in "$PLIST" "$APPDIR"/PlugIns/*.appex/Info.plist "$APPDIR"/Frameworks/*.framework/Info.plist; do
            [ -f "$P" ] || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$P" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$P"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_VERSION" "$P" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $APP_VERSION" "$P"
          done
          # the bundle ID the certificate is for (v2.05): with another one iOS gives Satori no folder in the picker;
          # the extensions keep their suffix after it
          for P in "$PLIST" "$APPDIR"/PlugIns/*.appex/Info.plist; do
            [ -f "$P" ] || continue
            OLD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$P")
            case "$OLD" in com.yoonchae.Yomikiri*) ;; *) continue ;; esac
            NEW="$BUNDLE_ID${OLD#com.yoonchae.Yomikiri}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW" "$P"
            echo "bundle ID: $OLD -> $NEW"
          done
          if [ "$EMBED_ENTITLEMENTS" != "false" ]; then
            # Put the App Group into the entitlements of the app and the extensions,
            # so the signing tool keeps it and they can share settings and statistics.
            APP_GROUPS_XML="<string>$GROUP_PREFIX.1</string>"
            KEYCHAIN_XML=""
            if [ "$FULL_ENTITLEMENTS" != "false" ]; then
              # all groups of the profile (the app and the extensions can then find a common one)
              # and a shared keychain group, covered by the profile's "TEAM.*" wildcard
              for i in 2 3 4 5; do
                APP_GROUPS_XML="$APP_GROUPS_XML<string>$GROUP_PREFIX.$i</string>"
              done
              KEYCHAIN_XML="<key>keychain-access-groups</key><array><string>$TEAM_ID.yomikiri.shared</string></array>"
            fi
            cat > /tmp/ent.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array>$APP_GROUPS_XML</array>
            $KEYCHAIN_XML
          </dict>
          </plist>
          EOF
            for f in "$APPDIR"/Frameworks/*.framework; do
              codesign --force --sign - --timestamp=none "$f"
            done
            for x in "$APPDIR"/PlugIns/*.appex; do
              codesign --force --sign - --timestamp=none --entitlements /tmp/ent.plist "$x"
            done
            codesign --force --sign - --timestamp=none --entitlements /tmp/ent.plist "$APPDIR"
            for x in "$APPDIR" "$APPDIR"/PlugIns/*.appex; do
              echo "== entitlements of $x"
              codesign -d --entitlements :- "$x" 2>&1 | head -20 || true
            done
          else
            find ipa/Payload \( -name "*.appex" -o -name "*.framework" -o -name "*.app" \) -print0 | xargs -0 -I{} codesign --remove-signature "{}" || true
          fi
          (cd ipa && zip -qry ../Satori-v${{ env.APP_VERSION }}.ipa Payload)
          ls -la Satori-v${{ env.APP_VERSION }}.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Satori-v${{ env.APP_VERSION }}-ipa
          path: src/Satori-v${{ env.APP_VERSION }}.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-v${{ env.APP_VERSION }}
          path: src/xcodebuild.log
          if-no-files-found: ignore
